id: https://w3id.org/linkml/mappings
title: LinkML Schema Mappings
name: mappings
description: LinkML model for mappings
license: https://creativecommons.org/publicdomain/zero/1.0/
version: 2.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  skos: http://www.w3.org/2004/02/skos/core#
  OIO: http://www.geneontology.org/formats/oboInOwl#
  IAO: http://purl.obolibrary.org/obo/IAO_

default_curi_maps:
  - semweb_context

default_prefix: linkml
default_range: string


emit_prefixes:
  - linkml
  - rdf
  - rdfs
  - xsd
  - skos
  - OIO
  - IAO

imports:
  - linkml:types

slots:
  mappings:
    aliases:
      - xrefs
      - identifiers
      - alternate identifiers
      - alternate ids
    range: uriorcurie
    multivalued: true
    description: >-
      A list of terms from different schemas or terminology systems that have comparable meaning.
      These may include terms that are precisely equivalent, broader or narrower in meaning, or otherwise semantically
      related but not equivalent from a strict ontological perspective.
    slot_uri: skos:mappingRelation

  exact_mappings:
    is_a: mappings
    range: uriorcurie
    title: exact mappings
    multivalued: true
    inherited: false
    description: >-
      A list of terms from different schemas or terminology systems that have identical meaning.
    slot_uri: skos:exactMatch

  close_mappings:
    is_a: mappings
    range: uriorcurie
    title: close mappings
    multivalued: true
    inherited: false
    description: >-
      A list of terms from different schemas or terminology systems that have close meaning.
    slot_uri: skos:closeMatch

  related_mappings:
    is_a: mappings
    range: uriorcurie
    title: related mappings
    multivalued: true
    inherited: false
    description: >-
      A list of terms from different schemas or terminology systems that have related meaning.
    slot_uri: skos:relatedMatch

  narrow_mappings:
    is_a: mappings
    range: uriorcurie
    title: narrow mappings
    multivalued: true
    inherited: false
    description: >-
      A list of terms from different schemas or terminology systems that have narrower meaning.
    slot_uri: skos:narrowMatch

  broad_mappings:
    is_a: mappings
    range: uriorcurie
    title: broad mappings
    multivalued: true
    inherited: false
    description: >-
      A list of terms from different schemas or terminology systems that have broader meaning.
    slot_uri: skos:broadMatch

  deprecated_element_has_exact_replacement:
    range: uriorcurie
    title: deprecated element has exact replacement
    description: >-
      When an element is deprecated, it can be automatically replaced by this uri or curie
    mappings:
      - IAO:0100001

  deprecated_element_has_possible_replacement:
    range: uriorcurie
    title: deprecated element has possible replacement
    description: >-
      When an element is deprecated, it can be potentially replaced by this uri or curie
    mappings:
      - OIO:consider
